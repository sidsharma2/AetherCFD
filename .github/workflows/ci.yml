# CI for AetherCFD Studio (docs/vision/roadmap.md, item Q1).
#
# Lint runs on Ubuntu (cheaper minutes). Tests run on Windows only: the app and its core are Windows programs
# (drive paths, wsl.exe creationflags, LOCALAPPDATA), so most core tests cannot run on Linux.
#
# Hosted runners have no GPU, no OpenFOAM distro and no corpus under D:\OpenFOAM, so tests marked wsl, wsl_slow,
# corpus or gl are deselected here; run them locally (README, Development). windows-2025 does ship wsl.exe, so the
# markers, not the "no WSL" skips, are what keeps live WSL tests out.
#
# Hangs: pytest-timeout (thread method) kills a test after 300 s and prints every thread's stack; faulthandler
# prints the stacks once a test passes 120 s (pyproject.toml). Job timeouts are a backstop.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.26"
  PYTHONUTF8: "1"
  MARKERS: "not wsl and not wsl_slow and not corpus and not gl"

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests packaging
      - name: Import contracts
        run: uv run lint-imports

  windows:
    name: Unit + studio tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      # Mesa llvmpipe as the system OpenGL driver (the runner has no GPU), so Qt and VTK share one real WGL context
      # as on a desktop. No OSMesa window default and no PYVISTA_OFF_SCREEN: the viewport is an on-screen pyvistaqt
      # widget, and those settings made pyvista build off-screen windows inside it (access violation in show_axes).
      - uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0
        with:
          pyvista: false
          install-mesa3d-offscreen: false
      - name: Unit tests
        run: uv run pytest tests/unit -m "${{ env.MARKERS }}" --junitxml=build/junit-unit-windows.xml
      - name: Studio tests
        if: success() || failure()
        run: uv run pytest tests/studio -m "${{ env.MARKERS }}" --junitxml=build/junit-studio-windows.xml
      - name: Upload reports and crash logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/junit-*.xml
            build/smoke/**
            ~/AppData/Local/AetherCFD/Cache/crash/**
            ~/AppData/Local/AetherCFD/Cache/studio.log
          if-no-files-found: ignore
