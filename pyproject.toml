[project]
name = "aethercfd"
version = "0.1.0.dev0"
description = "AetherCFD Studio: a desktop workbench that drives OpenFOAM without hiding it"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "AetherCFD Studio authors" }]
dependencies = [
    # --- headless core (must never import Qt) ---
    "pydantic>=2.8,<3",
    "watchdog>=4",
    "platformdirs>=4.3",
    "tomli-w>=1.0",
    "numpy>=2.0",
    # --- studio (UI) -- PySide6 and PySide6-QtAds MUST move together as an exact pair ---
    "PySide6==6.11.2",
    "PySide6-QtAds==5.1.1",
    "vtk==9.7.1",
    "pyvista==0.49.0",
    "pyvistaqt==0.13.1",
    "QtPy==2.4.3",
    "pyqtgraph==0.14.0",
    "qtawesome==1.4.2",
    "pywinpty==3.0.5; sys_platform == 'win32'",
    "rapidfuzz==3.14.6",
    "psutil>=6",
    "nvidia-ml-py>=12",
    "matplotlib>=3.9",  # publication plot export (runs in a subprocess with the user's style)
    "scipy>=1.18.1",
    "cupy-cuda12x>=13",
    "nvidia-cuda-nvrtc-cu12>=12.9.86",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    # CUDA linear algebra for GPU POD (cuBLAS/cuSOLVER; cuSPARSE, nvJitLink and cuRAND are what CuPy loads with them)
    "nvidia-cublas-cu12>=12.9,<13",
    "nvidia-cusolver-cu12>=11.7,<12",
    "nvidia-cusparse-cu12>=12.5,<13",
    "nvidia-nvjitlink-cu12>=12.9,<13",
    "nvidia-curand-cu12>=10.3,<11",
    "cantera>=3.1",
]

[project.scripts]
aethercfd = "aethercfd.scripting.cli:main"

[project.gui-scripts]
aethercfd-studio = "aethercfd.studio.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "foamlib>=1.0",
    "matplotlib>=3.9",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aethercfd"]

[tool.uv]
# never let a stray conda/Store interpreter be picked up
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=build/pytest-tmp"
markers = [
    "corpus: read-only tests over the real OpenFOAM cases under D:\\OpenFOAM",
    "wsl: needs the LMAE-OpenFOAM WSL distro (fast)",
    "wsl_slow: needs WSL and runs a solver (minutes)",
    "gl: needs a real OpenGL context (not the offscreen platform)",
    "slow: takes more than a few seconds (e.g. a Cantera flame solve)",
]
timeout = 300
# thread: works the same on Windows and Linux, and prints every thread's stack before it kills a hung test
timeout_method = "thread"
# print all stacks (without failing) once a test has run this long, to see where a slow test is before it times out
faulthandler_timeout = 120
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# vendored code and its ported tests stay as close to upstream as possible (ADR 0001)
"src/aethercfd/_vendor/*" = ["B", "SIM", "UP", "RUF"]
"tests/unit/test_vendor_*" = ["B", "SIM", "UP", "RUF"]
"spikes/*" = ["E402", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "aethercfd"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Headless core never imports Qt or the studio"
type = "forbidden"
source_modules = [
    "aethercfd.core",
    "aethercfd.foamdict",
    "aethercfd.case",
    "aethercfd.documents",
    "aethercfd.backend",
    "aethercfd.runs",
    "aethercfd.commands",
    "aethercfd.project",
    "aethercfd.services",
    "aethercfd.copilot",
    "aethercfd.firstrun",
]
forbidden_modules = ["PySide6", "PySide6QtAds", "pyvistaqt", "qtpy", "pyqtgraph", "aethercfd.studio"]

[[tool.importlinter.contracts]]
name = "Results code never imports Qt or the studio (ADR 0008: it runs on worker threads)"
type = "forbidden"
source_modules = ["aethercfd.results"]
forbidden_modules = ["PySide6", "PySide6QtAds", "pyvistaqt", "qtpy", "pyqtgraph", "aethercfd.studio"]
